<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品信息提取器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 420px; height: 650px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f9fafb; color: #1f2937; overflow: hidden; display: flex; flex-direction: column; }
    .header { background: #2563eb; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; }
    .toolbar { padding: 12px; border-bottom: 1px solid #e5e7eb; background: white; }
    .toolbar-top { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .toolbar-bottom { display: flex; gap: 8px; }
    .btn { padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; transition: background-color 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-purple { background: #9333ea; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .btn-orange { background: #f97316; color: white; }
    .btn-secondary { background: white; color: #374151; border: 1px solid #d1d5db; }
    .btn:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    .error-bar { padding: 8px 12px; background: #fee2e2; color: #dc2626; font-size: 12px; display: none; }
    .content-area { flex: 1; overflow-y: auto; padding: 12px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #9ca3af; text-align: center; }
    .empty-icon { font-size: 48px; margin-bottom: 8px; }
    .info-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .info-label { width: 64px; font-size: 12px; color: #6b7280; flex-shrink: 0; }
    .info-value { font-size: 12px; color: #1f2937; flex: 1; word-break: break-all; }
    .info-value a { color: #2563eb; text-decoration: none; }
    .tabs-bar { display: flex; gap: 4px; padding: 8px 12px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
    .tab-btn { flex: 1; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; border: none; background: transparent; color: #4b5563; }
    .tab-btn.active { background: #2563eb; color: white; }
    .param-item { display: flex; gap: 8px; padding: 8px; background: white; border-radius: 6px; border: 1px solid #f3f4f6; margin-bottom: 8px; }
    .param-item span:first-child { flex-shrink: 0; }
    .image-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 240px; overflow-y: auto; }
    .image-item { position: relative; aspect-ratio: 1; }
    .image-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid #e5e7eb; }
    .image-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; display: flex; align-items: center; justify-content: center; border-radius: 6px; transition: opacity 0.2s; }
    .image-item:hover .image-overlay { opacity: 1; }
    .copy-btn { padding: 4px 8px; background: white; color: #1f2937; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .report-container { background: white; border-radius: 6px; border: 1px solid #e5e7eb; padding: 12px; max-height: 320px; overflow-y: auto; font-size: 12px; line-height: 1.6; }
    .report-container h1 { font-size: 16px; margin-bottom: 8px; }
    .report-container h2 { font-size: 14px; margin-top: 12px; margin-bottom: 6px; }
    .report-container h3 { font-size: 12px; margin-top: 8px; margin-bottom: 4px; }
    .report-container li { margin-left: 20px; margin-bottom: 4px; }
    .project-item { background: white; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 8px; padding: 12px; }
    .project-create { display: flex; gap: 8px; margin-bottom: 16px; }
    .project-input { flex: 1; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; }
    .mini-btn-green { padding: 2px 6px; font-size: 10px; border-radius: 4px; border: none; cursor: pointer; background: #dcfce7; color: #16a34a; }
    .mini-btn-red { padding: 2px 6px; font-size: 10px; border-radius: 4px; border: none; cursor: pointer; background: #fee2e2; color: #dc2626; }
    .tag { padding: 2px 6px; font-size: 10px; border-radius: 4px; margin-right: 8px; }
    .tag-mine { background: #dbeafe; color: #1d4ed8; }
    .tag-competitor { background: #ffedd5; color: #ea580c; }
    .product-item { padding: 8px; background: #f9fafb; border-radius: 4px; margin-top: 8px; font-size: 12px; }
    .project-add-buttons { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f3f4f6; }
    .add-mine, .add-competitor { flex: 1; padding: 6px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
    .add-mine { background: #dbeafe; color: #1d4ed8; }
    .add-competitor { background: #ffedd5; color: #ea580c; }
    .setting-section { margin-bottom: 16px; }
    .setting-input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; margin-top: 4px; }
    .provider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 4px; }
    .provider-btn { padding: 8px; border-radius: 6px; border: 1px solid #d1d5db; font-size: 12px; cursor: pointer; background: white; }
    .provider-btn.active { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .setting-note { padding: 12px; background: #eff6ff; border-radius: 6px; font-size: 11px; color: #1d4ed8; }
    .setting-note ul { list-style: disc; margin-left: 20px; margin-top: 8px; }
    .setting-note li { margin-bottom: 4px; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #f1f1f1; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header"><span>🛒</span><span>商品信息提取器</span></div>
  
  <div class="toolbar">
    <div class="toolbar-top">
      <button class="btn btn-primary" id="btn-extract">提取信息</button>
      <button class="btn btn-purple" id="btn-ai" disabled>AI分析</button>
      <button class="btn btn-green" id="btn-export-excel" disabled>导出Excel</button>
      <button class="btn btn-orange" id="btn-export-md" disabled>导出报告</button>
    </div>
    <div class="toolbar-bottom">
      <button class="btn btn-secondary" id="btn-sidebar">📐 侧边栏</button>
      <button class="btn btn-secondary" id="btn-project">📁 项目分析</button>
      <button class="btn btn-secondary" id="btn-settings">⚙️ 设置</button>
      <button class="btn btn-secondary" id="btn-debug">🔍 调试</button>
    </div>
  </div>
  
  <div id="error-bar" class="error-bar"></div>
  
  <div id="empty-state" class="content-area scrollbar-thin">
    <div class="empty-state">
      <div class="empty-icon">📋</div>
      <div>点击"提取信息"按钮</div>
      <div style="font-size:12px;margin-top:4px;">开始提取商品详情</div>
    </div>
  </div>
  
  <div id="main-content" style="display:none;flex:1;flex-direction:column;">
    <div class="tabs-bar">
      <button class="tab-btn active" data-tab="basic">📋 基础信息</button>
      <button class="tab-btn" data-tab="params">📊 参数</button>
      <button class="tab-btn" data-tab="images">🖼️ 图片</button>
      <button class="tab-btn" data-tab="ai">🤖 AI分析</button>
    </div>
    <div class="content-area scrollbar-thin">
      <div id="tab-basic"></div>
      <div id="tab-params" style="display:none;"></div>
      <div id="tab-images" style="display:none;"></div>
      <div id="tab-ai" style="display:none;"></div>
    </div>
  </div>
  
  <div id="project-panel" class="content-area scrollbar-thin" style="display:none;"></div>
  <div id="settings-panel" class="content-area scrollbar-thin" style="display:none;"></div>
  <div id="debug-panel" class="content-area scrollbar-thin" style="display:none;">
    <div style="font-weight:bold;margin-bottom:8px;">🔍 页面结构扫描</div>
    <pre id="debug-output" style="font-size:11px;white-space:pre-wrap;word-break:break-all;background:#f9fafb;padding:8px;border-radius:4px;border:1px solid #e5e7eb;max-height:500px;overflow-y:auto;"></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
